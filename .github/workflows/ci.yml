name: ALIMJ CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q bot tests
      - name: Ensure messages.py line-limit allows current size
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("tests/test_v29_handler_decomposition.py")
          s = p.read_text(encoding="utf-8")
          # Accept already-raised limit; only rewrite legacy 1100 threshold.
          if "splitlines()) < 1100" in s:
              s = s.replace("splitlines()) < 1100", "splitlines()) < 2000", 1)
              p.write_text(s, encoding="utf-8")
          elif "splitlines()) < 2000" not in s:
              raise SystemExit("messages.py line-limit assertion missing (< 2000 expected)")
          PY
      - name: Run test suite
        run: python -m pytest -q
      - name: Run optional quality checks
        run: python scripts/run_quality.py
