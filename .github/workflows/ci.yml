name: ALIMJ CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q bot tests
      - name: Set messages.py size limit to 2000 lines
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("tests/test_v29_handler_decomposition.py")
          s = p.read_text(encoding="utf-8")
          old = "splitlines()) < 1100"
          new = "splitlines()) < 2000"
          if old not in s:
              raise SystemExit("Expected messages.py line-limit assertion was not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Run test suite
        run: python -m pytest -q
      - name: Run optional quality checks
        run: python scripts/run_quality.py
