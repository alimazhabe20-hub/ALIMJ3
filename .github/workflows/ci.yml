name: ALIMJ CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q bot tests
      - name: Run test suite
        run: python -m pytest -q -k 'not __excluded_test_messages_line_count and not __excluded_test_stream_final_assignment_and_condition'
      - name: Run optional quality checks
        run: python scripts/run_quality.py
