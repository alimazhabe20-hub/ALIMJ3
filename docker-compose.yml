services:
  alimj:
    build:
      context: .
      dockerfile: Dockerfile
    image: alimj:38.0.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8080"
      STARTUP_CHECK: "true"
      RELEASE_VERSION: "38.0.0"
    ports:
      - "8080:8080"
    volumes:
      - alimj-data:/app/data
      - alimj-logs:/app/logs
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  alimj-data:
  alimj-logs:
